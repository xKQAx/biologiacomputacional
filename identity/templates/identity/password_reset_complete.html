{% extends "base.html" %}
{% load static %}
{% block title %}Contraseña restablecida{% endblock %}

{% block content %}
<div class="container text-center py-5">
  <img src="{% static 'images/logo-color.png' %}" class="mb-4" width="90" height="75"
    alt="Logo Biología Computacional">

  <div class="info-card">
    <i class="info-card-icon fa-solid fa-circle-check text-success" aria-hidden="true"></i>
    <h2>¡Contraseña restablecida!</h2>
    <p class="mb-4">Tu contraseña se ha restablecido correctamente. Ahora puedes iniciar sesión
      con tu nueva contraseña.</p>
    <a class="btn btn-primary-custom" href="{% url 'signin' %}">
      <i class="fa-solid fa-arrow-right-to-bracket me-2" aria-hidden="true"></i>
      Iniciar sesión
    </a>
  </div>
</div>
{% endblock %}
