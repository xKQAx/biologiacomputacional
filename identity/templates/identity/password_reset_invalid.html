{% extends "base.html" %}
{% load static %}
{% block title %}Enlace inválido{% endblock %}

{% block content %}
<div class="container text-center py-5">
  <img src="{% static 'images/logo-color.png' %}" class="mb-4" width="90" height="75"
    alt="Logo Biología Computacional">

  <div class="info-card">
    <i class="info-card-icon fa-solid fa-circle-xmark text-danger" aria-hidden="true"></i>
    <h2>Enlace inválido o expirado</h2>
    <p class="mb-4">La solicitud de restablecimiento de contraseña es inválida. El enlace puede
      haber expirado o ya fue utilizado.</p>
    <a class="btn btn-primary-custom" href="{% url 'reset_password' %}">
      <i class="fa-solid fa-rotate-left me-2" aria-hidden="true"></i>
      Intentar de nuevo
    </a>
  </div>
</div>
{% endblock %}
