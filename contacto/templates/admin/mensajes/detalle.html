{% extends "admin/mensajes/base.html" %}

{% block content %}
<div id="content-main" class="admin-lab-cuentas">
  <p class="admin-lab-volver"><a href="{% url 'admin:mensajes' %}">Volver al listado</a></p>

  <dl class="admin-lab-detalle">
    <div>
      <dt>Fecha</dt>
      <dd>{{ mensaje.creado|date:"d/m/Y H:i" }}</dd>
    </div>
    <div>
      <dt>Nombre</dt>
      <dd>{{ mensaje.nombre_completo }}</dd>
    </div>
    <div>
      <dt>Correo</dt>
      <dd>{{ mensaje.email }}</dd>
    </div>
    <div>
      <dt>Teléfono</dt>
      <dd>{{ mensaje.telefono }}</dd>
    </div>
    <div>
      <dt>Mensaje</dt>
      <dd class="admin-lab-mensaje">{{ mensaje.opiniones }}</dd>
    </div>
    <div>
      <dt>Estado</dt>
      <dd>Leído</dd>
    </div>
  </dl>
</div>
{% endblock %}
